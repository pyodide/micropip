name: run remote package index tests

on:
  workflow_dispatch:

permissions:
  contents: read


jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        pyodide-version: ["314.0.8"]
        test-config: [
          {runner: selenium, runtime: chrome },
        ]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: 3.14

      - uses: pyodide/pyodide-actions/download-pyodide@754454c397921a0a74d301d5f0816276919bc914 # main
        with:
          version: ${{ matrix.pyodide-version }}
          to: dist

      - name: Install requirements
        shell: bash -l {0}
        run: |
          python3 -m pip install -e .[test]
          python3 -m pip install requests

      - name: Run tests
        shell: bash -l {0}
        run: |
          pytest -v \
            --dist-dir=./dist/ \
            --runner=${{ matrix.test-config.runner }} \
            --rt ${{ matrix.test-config.runtime }} \
            --run-remote-index-tests \
            tests/integration/test_remote_indexes.py
